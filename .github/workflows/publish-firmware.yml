name: Publish firmware to repo

on:
  workflow_run:
    workflows: ["Build ZMK firmware"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: /tmp/artifacts

      - name: Copy UF2s into firmware/
        run: |
          set -euo pipefail
          mkdir -p firmware
          find /tmp/artifacts -type f -name '*.uf2' -print
          # Artifact layout from ZMK user-config build: one dir per artifact-name
          for name in skeletyl_handwire_left skeletyl_handwire_right settings_reset; do
            src=$(find /tmp/artifacts -type f -name "${name}*.uf2" | head -1)
            if [ -z "$src" ]; then
              echo "missing $name uf2" >&2
              find /tmp/artifacts -type f >&2
              exit 1
            fi
            cp "$src" "firmware/${name}.uf2"
          done
          ls -la firmware/*.uf2

      - name: Commit firmware/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(firmware): update UF2s from CI [skip ci]"
          file_pattern: firmware/*.uf2
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
