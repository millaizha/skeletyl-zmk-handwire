name: Build ZMK firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    # Must match the ZMK revision pinned in config/west.yml.
    # config/west.yml tracks `main` because the `nice_nano//zmk` board target
    # does not exist in the v0.3 release.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
