# LEFT half only (the split CENTRAL). Merged on top of skeletyl_handwire.conf.
#
# These symbols depend on CONFIG_ZMK_SPLIT_ROLE_CENTRAL, so they must not be
# set for the right half.

# Pull the peripheral's battery level over the split link and republish it to
# the host, so macOS can show the right half's charge as well as the left's.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
