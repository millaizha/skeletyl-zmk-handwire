# Applies to BOTH halves.
# ZMK resolves this file from the shield directory name (`skeletyl_handwire`),
# so it is merged for skeletyl_handwire_left and skeletyl_handwire_right alike.
#
# Central-only options live in skeletyl_handwire_left.conf — setting them here
# makes the peripheral build emit "assigned 'y' but got 'n'" Kconfig warnings.

# --- Power ---------------------------------------------------------------
# Deep sleep after 15 minutes idle. Big win on a small LiPo; wake is instant
# because kscan0 is declared a wakeup-source.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Battery -------------------------------------------------------------
# Each half measures and reports its own cell.
CONFIG_ZMK_BATTERY_REPORTING=y

# --- Mouse ---------------------------------------------------------------
# Layer 5 uses &mmv / &msc / &mkp. Those drivers are compiled only when
# pointing support is on. It is not the default unless something selects it.
CONFIG_ZMK_POINTING=y

# --- Radio ---------------------------------------------------------------
# +8 dBm TX. Helps the split link stay solid across the gap between the
# halves and improves range to the Mac. Costs a little current.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Optional: ZMK Studio ------------------------------------------------
# The shield declares physical key positions, so Studio works. It is off by
# default to keep the firmware small. To enable it, add
#   snippet: studio-rpc-usb-uart
#   cmake-args: -DCONFIG_ZMK_STUDIO=y
# to the LEFT entry in build.yaml — Studio only runs on the central.
